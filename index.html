<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สูตรอาหารและการใช้วัตถุดิบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase App & Firestore SDKs (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      /* Palette สีหลัก */
      --bg: #f8f7f4;
      --surface: #ffffff;
      --surface-alt: #f3f1ed;
      --border: #e4e1db;
      --ink: #1e2022;
      --muted: #646970;
      --brand: #c85a32;
      --brand-hover: #b04b25;
      --brand-soft: #fdf3ef;
      --brand-ink: #ffffff;
      --accent: #2d6a4f;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(24, 24, 27, 0.06), 0 1px 2px rgba(24, 24, 27, 0.04);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --font: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .app-subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    /* Container & Layout */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    .status-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .status-banner.error {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    .status-banner.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-6);
      align-items: start;
    }

    @media (min-width: 820px) {
      .workspace {
        grid-template-columns: 340px 1fr;
      }
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .card-body {
      padding: var(--space-5);
    }

    /* Search Box */
    .search-box-wrapper {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border);
      background: var(--surface-alt);
    }

    .search-input-inner {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-inner svg {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding-left: 38px !important;
      padding-right: 30px !important;
      font-size: 13px !important;
    }

    .search-clear-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear-btn:hover {
      color: var(--ink);
    }

    /* Buttons */
    .btn {
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--brand);
      color: var(--brand-ink);
    }

    .btn-primary:hover {
      background: var(--brand-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface-alt);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-accent:hover {
      background: #23533e;
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--danger);
      padding: 6px 10px;
      font-size: 13px;
    }

    .btn-danger-ghost:hover {
      background: var(--danger-soft);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
    }

    /* Menu List */
    .menu-list {
      list-style: none;
      margin: 0;
      padding: var(--space-2);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      max-height: calc(100vh - 280px);
      overflow-y: auto;
    }

    .menu-item-btn {
      width: 100%;
      text-align: left;
      font: inherit;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: var(--space-3) var(--space-4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      color: var(--ink);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .menu-item-btn:hover {
      background: var(--surface-alt);
    }

    .menu-item-btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: -2px;
    }

    .menu-item-btn.active {
      background: var(--brand-soft);
      border-color: #f3d2c5;
      color: var(--brand);
      font-weight: 600;
    }

    .menu-item-name {
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-item-arrow {
      color: var(--muted);
      flex-shrink: 0;
      opacity: 0.6;
    }

    .menu-item-btn.active .menu-item-arrow {
      color: var(--brand);
      opacity: 1;
    }

    /* Empty States */
    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-5);
      color: var(--muted);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface-alt);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-3);
    }

    .empty-title {
      margin: 0 0 var(--space-1) 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
    }

    .empty-desc {
      margin: 0 0 var(--space-4) 0;
      font-size: 14px;
      color: var(--muted);
    }

    /* Detail View */
    .recipe-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-5);
      flex-wrap: wrap;
    }

    .recipe-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
    }

    .recipe-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .section-label {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 var(--space-3) 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-hint {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    /* Table */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .ingredient-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .ingredient-table th,
    .ingredient-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .ingredient-table th {
      background: var(--surface-alt);
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
    }

    .ingredient-table tr:last-child td {
      border-bottom: none;
    }

    .ingredient-table tbody tr:hover {
      background: #faf9f7;
    }

    .ingredient-table .num-col {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .ingredient-table .order-col {
      width: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* Forms */
    .form-group {
      margin-bottom: var(--space-5);
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: var(--space-2);
      color: var(--ink);
    }

    .input {
      width: 100%;
      font: inherit;
      font-size: 14px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(200, 90, 50, 0.14);
    }

    .input.input-error {
      border-color: var(--danger);
    }

    textarea.input {
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: var(--space-2);
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    .ing-rows-header {
      display: none;
      grid-template-columns: 1fr 140px 140px 100px;
      gap: var(--space-2);
      padding-bottom: var(--space-2);
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    @media (min-width: 640px) {
      .ing-rows-header {
        display: grid;
      }
    }

    .ing-rows-container {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .ing-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--surface-alt);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      align-items: center;
      transition: background-color 0.15s ease;
    }

    @media (min-width: 640px) {
      .ing-row {
        grid-template-columns: 1fr 140px 140px 100px;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 0;
      }
    }

    .row-actions-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-1);
    }

    .action-icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 38px;
      font-size: 12px;
      padding: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .action-icon-btn:hover:not(:disabled) {
      background: var(--surface-alt);
      border-color: #cbd5e1;
    }

    .action-icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .remove-row-btn {
      color: var(--danger);
    }

    .remove-row-btn:hover {
      background: var(--danger-soft);
      border-color: #fecaca;
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border);
      margin-top: var(--space-5);
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card-lg {
      max-width: 620px;
    }

    .modal-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .modal-body {
      padding: var(--space-5);
    }

    .modal-footer {
      padding: var(--space-4) var(--space-5);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      background: var(--surface-alt);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-3);
    }

    .instructions-text-box {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink);
      background: var(--surface-alt);
      padding: var(--space-4);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      max-height: 55vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
            <path d="M7 2v20"></path>
            <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
          </svg>
        </div>
        <div>
          <h1 class="app-title">สูตรอาหารและการใช้วัตถุดิบ</h1>
          <p class="app-subtitle">จัดการเมนู ค้นหา จัดเรียงวัตถุดิบ พร้อมป๊อปอัปวิธีทำ (Cloud Real-time)</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="btnConfig">ตั้งค่า Firebase</button>
        <button type="button" class="btn btn-primary" id="btnAddMenuHeader">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          เพิ่มเมนูใหม่
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="statusBanner" class="status-banner" style="display:none;"></div>

    <div class="workspace">
      <!-- คอลัมน์ซ้าย: รายการเมนูอาหาร + กล่องค้นหา -->
      <section class="card" aria-labelledby="menuListHeading">
        <div class="card-header">
          <h2 class="card-title" id="menuListHeading">รายการเมนูอาหาร</h2>
          <span id="menuCountBadge" style="font-size: 12px; color: var(--muted); font-weight: 500;">0 เมนู</span>
        </div>
        <div class="search-box-wrapper">
          <div class="search-input-inner">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="menuSearchInput" class="input search-input" placeholder="พิมพ์ค้นหาชื่อเมนูอาหาร..." aria-label="พิมพ์ค้นหาชื่อเมนูอาหาร">
            <button type="button" id="btnClearSearch" class="search-clear-btn" title="ล้างคำค้นหา" aria-label="ล้างคำค้นหา">✕</button>
          </div>
        </div>
        <div id="menuListContainer"></div>
      </section>

      <!-- คอลัมน์ขวา: รายละเอียดวัตถุดิบ หรือ ฟอร์มจัดการ -->
      <section class="card" id="mainPanel" aria-live="polite"></section>
    </div>
  </main>

  <!-- Modal สำหรับแสดงวิธีทำ / ขั้นตอนการทำอาหาร (ป๊อปอัปเมื่อกดปุ่มดูวิธีทำ) -->
  <div class="modal-backdrop" id="instructionsModal" role="dialog" aria-modal="true" aria-labelledby="instructionsModalTitle">
    <div class="modal-card modal-card-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="instructionsModalTitle">📖 วิธีทำอาหาร</h3>
        <button type="button" class="btn-danger-ghost" id="btnCloseInstructionsModal" title="ปิดหน้าต่าง">✕</button>
      </div>
      <div class="modal-body">
        <p id="instructionsMenuName" style="font-weight: 600; font-size: 15px; margin: 0 0 var(--space-3) 0; color: var(--brand);"></p>
        <div id="instructionsModalContent" class="instructions-text-box"></div>
      </div>
      <div class="modal-footer" style="justify-content: flex-end;">
        <button type="button" class="btn btn-secondary btn-sm" id="btnDismissInstructionsModal">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>

  <!-- Modal สำหรับตั้งค่า Firebase API แยกช่องกรอก -->
  <div class="modal-backdrop" id="configModal" role="dialog" aria-modal="true" aria-labelledby="configModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="configModalTitle">ตั้งค่าการเชื่อมต่อ Firebase</h3>
        <button type="button" class="btn-danger-ghost" id="btnCloseModal" title="ปิดหน้าต่าง">✕</button>
      </div>
      <div class="modal-body">
        <p style="margin: 0 0 var(--space-4) 0; font-size: 13px; color: var(--muted);">
          กรอกข้อมูล Firebase Configuration ที่ได้รับจากเมนู <strong>Project settings &gt; General &gt; Your apps</strong> บน Firebase Console
        </p>
        <div class="form-grid">
          <div>
            <label class="form-label" style="font-size: 13px;" for="cfgApiKey">API Key</label>
            <input type="text" id="cfgApiKey" class="input" placeholder="AIzaSy...">
          </div>
          <div>
            <label class="form-label" style="font-size: 13px;" for="cfgAuthDomain">Auth Domain</label>
            <input type="text" id="cfgAuthDomain" class="input" placeholder="project-id.firebaseapp.com">
          </div>
          <div>

            <input type="text" id="cfgProjectId" class="input" placeholder="project-id">
          </div>
          <div>
            <label class="form-label" style="font-size: 13px;" for="cfgStorageBucket">Storage Bucket</label>
            <input type="text" id="cfgStorageBucket" class="input" placeholder="project-id.appspot.com">

          <div>
            <label class="form-label" style="font-size: 13px;" for="cfgMessagingSenderId">Messaging Sender ID</label>
            <input type="text" id="cfgMessagingSenderId" class="input" placeholder="1234567890">
          </div>
          <div>
            <label class="form-label" style="font-size: 13px;" for="cfgAppId">App ID</label>

        <div style="display: flex; gap: var(--space-2);">
          <button type="button" class="btn btn-secondary btn-sm" id="btnCancelModal">ยกเลิก</button>
          <button type="button" class="btn btn-primary btn-sm" id="btnSaveConfig">บันทึกและเชื่อมต่อ</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      /**
       * ค่าคอนฟิกกลางจาก Firebase Console:
       * ใส่ค่าจริงที่นี่ก่อน Deploy ขึ้น Firebase Hosting เพื่อให้ทุกเครื่องที่เปิดลิงก์เห็นข้อมูลตรงกันทันที!
       */
      const BUILTIN_FIREBASE_CONFIG = {
        apiKey: "AIzaSyAEwHZcOt1JLgUL2m-K1R9rggCxeiMHV_c",             // เช่น ""
        authDomain: "recipes-9bf8c.firebaseapp.com",         // เช่น "my-recipes.firebaseapp.com"
        projectId: "recipes-9bf8c",          // เช่น "my-recipes"
        storageBucket: "recipes-9bf8c.firebasestorage.app",      // เช่น "my-recipes.appspot.com"
        messagingSenderId: "906965866428",  // เช่น "1234567890"
        appId: "1:906965866428:web:f3d0d43ba3159bd925bdb9"               // เช่น "1:1234567890:web:abcdef"
      };

      let db = null;
      let menus = [];
      let selectedMenuId = null;
      let viewMode = 'detail'; // 'detail' | 'form'
      let editingMenuId = null;
      let searchQuery = '';

      const menuListContainer = document.getElementById('menuListContainer');
      const mainPanel = document.getElementById('mainPanel');
      const btnAddMenuHeader = document.getElementById('btnAddMenuHeader');
      const btnConfig = document.getElementById('btnConfig');
      const statusBanner = document.getElementById('statusBanner');
      const menuSearchInput = document.getElementById('menuSearchInput');
      const btnClearSearch = document.getElementById('btnClearSearch');
      const menuCountBadge = document.getElementById('menuCountBadge');

      // Modal Config Elements
      const configModal = document.getElementById('configModal');
      const btnCloseModal = document.getElementById('btnCloseModal');
      const btnCancelModal = document.getElementById('btnCancelModal');
      const btnSaveConfig = document.getElementById('btnSaveConfig');
      const btnResetConfig = document.getElementById('btnResetConfig');

      const cfgApiKey = document.getElementById('cfgApiKey');
      const cfgAuthDomain = document.getElementById('cfgAuthDomain');
      const cfgProjectId = document.getElementById('cfgProjectId');
      const cfgStorageBucket = document.getElementById('cfgStorageBucket');
      const cfgMessagingSenderId = document.getElementById('cfgMessagingSenderId');
      const cfgAppId = document.getElementById('cfgAppId');

      // Modal Instructions Elements
      const instructionsModal = document.getElementById('instructionsModal');
      const instructionsModalTitle = document.getElementById('instructionsModalTitle');
      const instructionsMenuName = document.getElementById('instructionsMenuName');
      const instructionsModalContent = document.getElementById('instructionsModalContent');
      const btnCloseInstructionsModal = document.getElementById('btnCloseInstructionsModal');
      const btnDismissInstructionsModal = document.getElementById('btnDismissInstructionsModal');

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showStatus(message, type = 'info') {
        statusBanner.textContent = message;
        statusBanner.className = 'status-banner' + (type === 'error' ? ' error' : (type === 'success' ? ' success' : ''));
        statusBanner.style.display = 'block';
      }

      function getEffectiveConfig() {
        const custom = localStorage.getItem('recipe_firebase_config');
        if (custom) {
          try {
            const parsed = JSON.parse(custom);
            if (parsed.apiKey && parsed.projectId) return parsed;
          } catch (e) {}
        }
        return BUILTIN_FIREBASE_CONFIG;
      }

      function initStorage() {
        const config = getEffectiveConfig();

        if (config.apiKey && config.projectId) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(config);
            }
            db = firebase.firestore();
            showStatus('เชื่อมต่อ Cloud Firestore เรียบร้อย (ข้อมูลซิงก์ตรงกันทุกอุปกรณ์แบบ Real-time)', 'success');
            listenToDatabase();
          } catch (err) {
            showStatus('เชื่อมต่อ Firebase Cloud ไม่สำเร็จ: ' + err.message + ' (สลับไปใช้ Local Storage ในเครื่อง)', 'error');
            initLocalStorageFallback();
          }
        } else {
          showStatus('กำลังใช้งานโหมด Local Storage ในเครื่อง (โปรดใส่ค่า Firebase Config ในโค้ดหรือกด "ตั้งค่า Firebase" เพื่อให้ทุกเครื่องเห็นข้อมูลเดียวกัน)');
          initLocalStorageFallback();
        }
      }

      function initLocalStorageFallback() {
        db = null;
        const local = localStorage.getItem('local_recipe_menus');
        menus = local ? JSON.parse(local) : [];
        if (menus.length > 0 && !selectedMenuId) {
          selectedMenuId = menus[0].id;
        }
        renderMenuList();
        renderMainPanel();
      }

      function listenToDatabase() {
        if (!db) return;
        db.collection('recipes').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
          menus = [];
          snapshot.forEach(doc => {
            menus.push({ id: doc.id, ...doc.data() });
          });
          if (menus.length > 0 && !selectedMenuId) {
            selectedMenuId = menus[0].id;
          }
          renderMenuList();
          renderMainPanel();
        }, (err) => {
          showStatus('เกิดข้อผิดพลาดในการโหลดข้อมูลจาก Firestore: ' + err.message, 'error');
        });
      }

      function saveMenuRecord(menuData, menuId = null) {
        if (db) {
          if (menuId) {
            return db.collection('recipes').doc(menuId).update({
              name: menuData.name,
              ingredients: menuData.ingredients,
              instructions: menuData.instructions || '',
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            return db.collection('recipes').add({
              name: menuData.name,
              ingredients: menuData.ingredients,
              instructions: menuData.instructions || '',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } else {
          if (menuId) {
            const idx = menus.findIndex(m => m.id === menuId);
            if (idx !== -1) menus[idx] = { id: menuId, ...menuData };
            selectedMenuId = menuId;
          } else {
            const newMenu = { id: 'local_' + Date.now(), ...menuData };
            menus.unshift(newMenu);
            selectedMenuId = newMenu.id;
          }
          localStorage.setItem('local_recipe_menus', JSON.stringify(menus));
          renderMenuList();
          renderMainPanel();
          return Promise.resolve();
        }
      }

      function deleteMenuRecord(menuId) {
        if (db) {
          return db.collection('recipes').doc(menuId).delete();
        } else {
          menus = menus.filter(m => m.id !== menuId);
          localStorage.setItem('local_recipe_menus', JSON.stringify(menus));
          selectedMenuId = menus.length > 0 ? menus[0].id : null;
          renderMenuList();
          renderMainPanel();
          return Promise.resolve();
        }
      }

      function openCreateForm() {
        viewMode = 'form';
        editingMenuId = null;
        renderMenuList();
        renderMainPanel();
      }

      function openEditForm(menuId) {
        viewMode = 'form';
        editingMenuId = menuId;
        renderMenuList();
        renderMainPanel();
      }

      function selectMenu(menuId) {
        selectedMenuId = menuId;
        viewMode = 'detail';
        editingMenuId = null;
        renderMenuList();
        renderMainPanel();
      }

      function getFilteredMenus() {
        if (!searchQuery.trim()) return menus;
        const q = searchQuery.trim().toLowerCase();
        return menus.filter(m => {
          const matchName = m.name && m.name.toLowerCase().includes(q);
          const matchIngredient = Array.isArray(m.ingredients) && m.ingredients.some(ing => ing.name && ing.name.toLowerCase().includes(q));
          return matchName || matchIngredient;
        });
      }

      function renderMenuList() {
        const filtered = getFilteredMenus();
        menuCountBadge.textContent = `${filtered.length} เมนู`;

        if (menus.length === 0) {
          menuListContainer.innerHTML =
            '<div class="empty-state">' +
              '<div class="empty-icon" aria-hidden="true">' +
                '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>' +
                '</svg>' +
              '</div>' +
              '<p class="empty-title">ยังไม่มีรายการเมนู</p>' +
              '<p class="empty-desc">เริ่มต้นด้วยการเพิ่มเมนูอาหารและระบุวัตถุดิบที่ใช้</p>' +
              '<button type="button" class="btn btn-secondary btn-sm" id="btnEmptyAddMenu">+ เพิ่มเมนูแรก</button>' +
            '</div>';

          const btnEmptyAdd = document.getElementById('btnEmptyAddMenu');
          if (btnEmptyAdd) {
            btnEmptyAdd.addEventListener('click', openCreateForm);
          }
          return;
        }

        if (filtered.length === 0) {
          menuListContainer.innerHTML =
            '<div class="empty-state" style="padding: var(--space-6) var(--space-4);">' +
              '<p class="empty-title" style="font-size: 15px;">ไม่พบเมนูที่ค้นหา</p>' +
              '<p class="empty-desc" style="font-size: 13px;">ลองค้นหาด้วยคำอื่น หรือกดล้างคำค้นหา</p>' +
            '</div>';
          return;
        }

        let listHtml = '<ul class="menu-list">';
        filtered.forEach(function (menu) {
          const isActive = (viewMode === 'detail' && menu.id === selectedMenuId) ||
                           (viewMode === 'form' && menu.id === editingMenuId);
          listHtml +=
            '<li>' +
              '<button type="button" class="menu-item-btn ' + (isActive ? 'active' : '') + '" data-menu-id="' + escapeHtml(menu.id) + '">' +
                '<span class="menu-item-name">' + escapeHtml(menu.name) + '</span>' +
                '<svg class="menu-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                  '<polyline points="9 18 15 12 9 6"></polyline>' +
                '</svg>' +
              '</button>' +
            '</li>';
        });
        listHtml += '</ul>';
        menuListContainer.innerHTML = listHtml;

        menuListContainer.querySelectorAll('.menu-item-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            selectMenu(btn.getAttribute('data-menu-id'));
          });
        });
      }

      function openInstructionsModal(menu) {
        instructionsMenuName.textContent = 'เมนู: ' + menu.name;
        if (menu.instructions && menu.instructions.trim()) {
          instructionsModalContent.textContent = menu.instructions.trim();
        } else {
          instructionsModalContent.innerHTML = '<span style="color: var(--muted); font-style: italic;">เมนูนี้ยังไม่ได้ระบุขั้นตอนหรือวิธีทำไว้ สามารถกดปุ่ม "แก้ไขเมนู" เพื่อเพิ่มวิธีทำได้ค่ะ</span>';
        }
        instructionsModal.classList.add('open');
      }

      function closeInstructionsModal() {
        instructionsModal.classList.remove('open');
      }

      function renderMainPanel() {
        if (viewMode === 'form') {
          renderFormPanel();
          return;
        }

        const currentMenu = menus.find(function (m) { return m.id === selectedMenuId; });

        if (!currentMenu) {
          mainPanel.innerHTML =
            '<div class="empty-state">' +
              '<div class="empty-icon" aria-hidden="true">' +
                '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<circle cx="12" cy="12" r="10"></circle>' +
                  '<line x1="12" y1="8" x2="12" y2="12"></line>' +
                  '<line x1="12" y1="16" x2="12.01" y2="16"></line>' +
                '</svg>' +
              '</div>' +
              '<p class="empty-title">เลือกเมนูอาหารเพื่อดูรายละเอียดวัตถุดิบ</p>' +
              '<p class="empty-desc">กดที่รายการเมนูทางด้านซ้าย หรือเพิ่มเมนูอาหารใหม่เพื่อบันทึกน้ำหนักและปริมาณวัตถุดิบ</p>' +
              '<button type="button" class="btn btn-primary" id="btnDetailEmptyAdd">+ เพิ่มเมนูใหม่</button>' +
            '</div>';

          const btnDetailEmptyAdd = document.getElementById('btnDetailEmptyAdd');
          if (btnDetailEmptyAdd) {
            btnDetailEmptyAdd.addEventListener('click', openCreateForm);
          }
          return;
        }

        let rowsHtml = '';
        (currentMenu.ingredients || []).forEach(function (ing, index) {
          rowsHtml +=
            '<tr>' +
              '<td class="order-col">' + (index + 1) + '</td>' +
              '<td><strong>' + escapeHtml(ing.name) + '</strong></td>' +
              '<td class="num-col">' + escapeHtml(ing.weight || '-') + '</td>' +
              '<td class="num-col">' + escapeHtml(ing.quantity || '-') + '</td>' +
            '</tr>';
        });

        mainPanel.innerHTML =
          '<div class="card-body">' +
            '<div class="recipe-header">' +
              '<div>' +
                '<h2 class="recipe-title">' + escapeHtml(currentMenu.name) + '</h2>' +
                '<span style="font-size: 13px; color: var(--muted);">' + ((currentMenu.ingredients || []).length) + ' รายการวัตถุดิบ</span>' +
              '</div>' +
              '<div class="recipe-actions">' +
                '<button type="button" class="btn btn-accent btn-sm" id="btnViewInstructions">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>' +
                    '<path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>' +
                  '</svg>' +
                  'ดูวิธีทำ' +
                '</button>' +
                '<button type="button" class="btn btn-secondary btn-sm" id="btnEditRecipe">แก้ไขเมนู</button>' +
                '<button type="button" class="btn btn-danger-ghost" id="btnDeleteRecipe">ลบเมนู</button>' +
              '</div>' +
            '</div>' +
            '<div class="section-label">' +
              '<span>วัตถุดิบที่ต้องใช้ในเมนู</span>' +
              '<span class="section-hint">เรียงตามลำดับที่บันทึกไว้</span>' +
            '</div>' +
            '<div class="table-wrapper">' +
              '<table class="ingredient-table">' +
                '<thead>' +
                  '<tr>' +
                    '<th class="order-col">#</th>' +
                    '<th>รายการวัตถุดิบ</th>' +
                    '<th class="num-col">น้ำหนัก</th>' +
                    '<th class="num-col">ปริมาณ</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody>' +
                  rowsHtml +
                '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';

        document.getElementById('btnViewInstructions').addEventListener('click', function () {
          openInstructionsModal(currentMenu);
        });

        document.getElementById('btnEditRecipe').addEventListener('click', function () {
          openEditForm(currentMenu.id);
        });

        document.getElementById('btnDeleteRecipe').addEventListener('click', function () {
          if (confirm('คุณต้องการลบเมนู "' + currentMenu.name + '" ใช่หรือไม่?')) {
            deleteMenuRecord(currentMenu.id);
          }
        });
      }

      function updateRowButtons(container) {
        const rows = container.querySelectorAll('.ing-row');
        rows.forEach(function (row, idx) {
          const upBtn = row.querySelector('.move-up-btn');
          const downBtn = row.querySelector('.move-down-btn');
          if (upBtn) upBtn.disabled = (idx === 0);
          if (downBtn) downBtn.disabled = (idx === rows.length - 1);
        });
      }

      function renderFormPanel() {
        const editingMenu = editingMenuId
          ? menus.find(function (m) { return m.id === editingMenuId; })
          : null;

        const initialName = editingMenu ? editingMenu.name : '';
        const initialInstructions = editingMenu && editingMenu.instructions ? editingMenu.instructions : '';
        const initialIngredients = editingMenu && editingMenu.ingredients && editingMenu.ingredients.length > 0
          ? editingMenu.ingredients.map(function (i) {
              return { name: i.name, weight: i.weight, quantity: i.quantity };
            })
          : [{ name: '', weight: '', quantity: '' }];

        mainPanel.innerHTML =
          '<div class="card-header">' +
            '<h2 class="card-title">' + (editingMenu ? 'แก้ไขเมนูอาหาร' : 'เพิ่มเมนูอาหารใหม่') + '</h2>' +
          '</div>' +
          '<div class="card-body">' +
            '<form id="recipeForm" novalidate>' +
              '<div class="form-group">' +
                '<label class="form-label" for="menuNameInput">ชื่อเมนูอาหาร</label>' +
                '<input type="text" id="menuNameInput" class="input" placeholder="เช่น ข้าวผัดกะเพราไก่, ต้มยำกุ้ง" value="' + escapeHtml(initialName) + '" required>' +
                '<div class="error-msg" id="menuNameError">กรุณาระบุชื่อเมนูอาหาร</div>' +
              '</div>' +

              '<div class="form-group">' +
                '<div class="section-label">' +
                  '<span>รายการวัตถุดิบ น้ำหนัก และปริมาณ</span>' +
                  '<span class="section-hint">กดปุ่ม ▲ ▼ เพื่อเลื่อนจัดเรียงลำดับวัตถุดิบได้เอง</span>' +
                '</div>' +
                '<div class="ing-rows-header">' +
                  '<span>ชื่อวัตถุดิบ</span>' +
                  '<span>น้ำหนัก (เช่น 200 กรัม)</span>' +
                  '<span>ปริมาณ (เช่น 2 ช้อนโต๊ะ)</span>' +
                  '<span style="text-align: right;">ลำดับ / ลบ</span>' +
                '</div>' +
                '<div class="ing-rows-container" id="ingRowsContainer"></div>' +
                '<div class="error-msg" id="ingRowsError">กรุณาระบุวัตถุดิบอย่างน้อย 1 รายการ (ต้องใส่ชื่อวัตถุดิบ และน้ำหนักหรือปริมาณ)</div>' +
                '<button type="button" class="btn btn-secondary btn-sm" id="btnAddIngredientRow">+ เพิ่มรายการวัตถุดิบ</button>' +
              '</div>' +

              '<div class="form-group">' +
                '<label class="form-label" for="menuInstructionsInput">ขั้นตอนการทำ / สูตรวิธีทำ (ไม่บังคับ)</label>' +
                '<textarea id="menuInstructionsInput" class="input" rows="6" placeholder="ระบุขั้นตอนการปรุง เช่น:&#10;1. ตั้งกระทะใส่น้ำมันและผัดกระเทียมพริกจนหอม&#10;2. ใส่เนื้อไก่ลงไปผัดจนสุกทั่ว...">' + escapeHtml(initialInstructions) + '</textarea>' +
                '<span style="font-size: 12px; color: var(--muted); display: block; margin-top: 4px;">* ข้อความวิธีทำจะไม่แสดงรบกวนในหน้าหลักทันที แต่จะเปิดเป็นหน้าต่างป๊อปอัปเมื่อกดปุ่ม &quot;ดูวิธีทำ&quot;</span>' +
              '</div>' +

              '<div class="form-footer">' +
                '<button type="button" class="btn btn-secondary" id="btnCancelForm">ยกเลิก</button>' +
                '<button type="submit" class="btn btn-primary">บันทึกเมนู</button>' +
              '</div>' +
            '</form>' +
          '</div>';

        const ingRowsContainer = document.getElementById('ingRowsContainer');
        const btnAddIngredientRow = document.getElementById('btnAddIngredientRow');
        const btnCancelForm = document.getElementById('btnCancelForm');
        const recipeForm = document.getElementById('recipeForm');
        const menuNameInput = document.getElementById('menuNameInput');
        const menuInstructionsInput = document.getElementById('menuInstructionsInput');
        const menuNameError = document.getElementById('menuNameError');
        const ingRowsError = document.getElementById('ingRowsError');

        function addIngredientRowElement(item) {
          const row = document.createElement('div');
          row.className = 'ing-row';
          row.innerHTML =
            '<input type="text" class="input ing-name" placeholder="ชื่อวัตถุดิบ (เช่น เนื้อไก่)" aria-label="ชื่อวัตถุดิบ" value="' + escapeHtml(item.name) + '">' +
            '<input type="text" class="input ing-weight" placeholder="น้ำหนัก (เช่น 150 กรัม)" aria-label="น้ำหนัก" value="' + escapeHtml(item.weight) + '">' +
            '<input type="text" class="input ing-qty" placeholder="ปริมาณ (เช่น 1 ถ้วย)" aria-label="ปริมาณ" value="' + escapeHtml(item.quantity) + '">' +
            '<div class="row-actions-group">' +
              '<button type="button" class="action-icon-btn move-up-btn" title="เลื่อนขึ้น" aria-label="เลื่อนขึ้น">▲</button>' +
              '<button type="button" class="action-icon-btn move-down-btn" title="เลื่อนลง" aria-label="เลื่อนลง">▼</button>' +
              '<button type="button" class="action-icon-btn remove-row-btn" title="ลบวัตถุดิบนี้" aria-label="ลบวัตถุดิบนี้">✕</button>' +
            '</div>';

          // ปุ่มเลื่อนขึ้น
          const upBtn = row.querySelector('.move-up-btn');
          upBtn.addEventListener('click', function () {
            const prev = row.previousElementSibling;
            if (prev) {
              ingRowsContainer.insertBefore(row, prev);
              updateRowButtons(ingRowsContainer);
            }
          });

          // ปุ่มเลื่อนลง
          const downBtn = row.querySelector('.move-down-btn');
          downBtn.addEventListener('click', function () {
            const next = row.nextElementSibling;
            if (next) {
              ingRowsContainer.insertBefore(next, row);
              updateRowButtons(ingRowsContainer);
            }
          });

          // ปุ่มลบ
          const removeBtn = row.querySelector('.remove-row-btn');
          removeBtn.addEventListener('click', function () {
            if (ingRowsContainer.children.length > 1) {
              row.remove();
            } else {
              row.querySelector('.ing-name').value = '';
              row.querySelector('.ing-weight').value = '';
              row.querySelector('.ing-qty').value = '';
            }
            updateRowButtons(ingRowsContainer);
          });

          ingRowsContainer.appendChild(row);
          updateRowButtons(ingRowsContainer);
        }

        initialIngredients.forEach(function (ing) {
          addIngredientRowElement(ing);
        });

        btnAddIngredientRow.addEventListener('click', function () {
          addIngredientRowElement({ name: '', weight: '', quantity: '' });
        });

        btnCancelForm.addEventListener('click', function () {
          viewMode = 'detail';
          editingMenuId = null;
          renderMenuList();
          renderMainPanel();
        });

        recipeForm.addEventListener('submit', function (e) {
          e.preventDefault();
          menuNameError.classList.remove('visible');
          menuNameInput.classList.remove('input-error');
          ingRowsError.classList.remove('visible');

          const menuName = menuNameInput.value.trim();
          const instructions = menuInstructionsInput.value.trim();
          let valid = true;

          if (!menuName) {
            menuNameError.classList.add('visible');
            menuNameInput.classList.add('input-error');
            valid = false;
          }

          const rowElements = ingRowsContainer.querySelectorAll('.ing-row');
          const collectedIngredients = [];

          rowElements.forEach(function (rowEl) {
            const nameVal = rowEl.querySelector('.ing-name').value.trim();
            const weightVal = rowEl.querySelector('.ing-weight').value.trim();
            const qtyVal = rowEl.querySelector('.ing-qty').value.trim();

            if (nameVal && (weightVal || qtyVal)) {
              collectedIngredients.push({
                name: nameVal,
                weight: weightVal,
                quantity: qtyVal
              });
            }
          });

          if (collectedIngredients.length === 0) {
            ingRowsError.classList.add('visible');
            valid = false;
          }

          if (!valid) return;

          saveMenuRecord({
            name: menuName,
            ingredients: collectedIngredients,
            instructions: instructions
          }, editingMenuId).then(function () {
            viewMode = 'detail';
            editingMenuId = null;
            renderMenuList();
            renderMainPanel();
          });
        });

        menuNameInput.focus();
      }

      // ระบบค้นหาเมนู
      menuSearchInput.addEventListener('input', function (e) {
        searchQuery = e.target.value;
        btnClearSearch.style.display = searchQuery ? 'inline-flex' : 'none';
        renderMenuList();
      });

      btnClearSearch.addEventListener('click', function () {
        menuSearchInput.value = '';
        searchQuery = '';
        btnClearSearch.style.display = 'none';
        renderMenuList();
        menuSearchInput.focus();
      });

      // Modal Instructions Handlers
      btnCloseInstructionsModal.addEventListener('click', closeInstructionsModal);
      btnDismissInstructionsModal.addEventListener('click', closeInstructionsModal);
      instructionsModal.addEventListener('click', function (e) {
        if (e.target === instructionsModal) {
          closeInstructionsModal();
        }
      });

      // Modal Config Handlers
      function openConfigModal() {
        const current = getEffectiveConfig();
        cfgApiKey.value = current.apiKey || '';
        cfgAuthDomain.value = current.authDomain || '';
        cfgProjectId.value = current.projectId || '';
        cfgStorageBucket.value = current.storageBucket || '';
        cfgMessagingSenderId.value = current.messagingSenderId || '';
        cfgAppId.value = current.appId || '';
        configModal.classList.add('open');
      }

      function closeConfigModal() {
        configModal.classList.remove('open');
      }

      btnConfig.addEventListener('click', openConfigModal);
      btnCloseModal.addEventListener('click', closeConfigModal);
      btnCancelModal.addEventListener('click', closeConfigModal);

      btnSaveConfig.addEventListener('click', function () {
        const newConfig = {
          apiKey: cfgApiKey.value.trim(),
          authDomain: cfgAuthDomain.value.trim(),
          projectId: cfgProjectId.value.trim(),
          storageBucket: cfgStorageBucket.value.trim(),
          messagingSenderId: cfgMessagingSenderId.value.trim(),
          appId: cfgAppId.value.trim()
        };

        if (!newConfig.projectId || !newConfig.apiKey) {
          alert('กรุณาระบุอย่างน้อย API Key และ Project ID เพื่อเชื่อมต่อ Firebase');
          return;
        }

        localStorage.setItem('recipe_firebase_config', JSON.stringify(newConfig));
        closeConfigModal();
        location.reload();
      });

      btnResetConfig.addEventListener('click', function () {
        if (confirm('คุณต้องการรีเซ็ตการเชื่อมต่อและกลับไปใช้ Local Storage ในเครื่องหรือไม่?')) {
          localStorage.removeItem('recipe_firebase_config');
          closeConfigModal();
          location.reload();
        }
      });

      configModal.addEventListener('click', function (e) {
        if (e.target === configModal) {
          closeConfigModal();
        }
      });

      btnAddMenuHeader.addEventListener('click', openCreateForm);

      // เริ่มต้นระบบ
      initStorage();
    })();
  </script>
</body>
</html>
